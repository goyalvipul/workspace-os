name: Commit regenerated Workspace branding PNGs

on:
  push:
    branches:
      - feat/nori-inspired-ux-phase2-3
    paths:
      - .github/workflows/commit-branding-assets.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  commit-icons:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Render PNG app and favicon icons
        run: node scripts/gen-icons.mjs
      - name: Commit generated image assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/public/icons/
          if ! git diff --cached --quiet; then
            git commit -m 'chore(branding): commit generated app and favicon PNG assets [skip ci]'
            git push origin HEAD:feat/nori-inspired-ux-phase2-3
          fi

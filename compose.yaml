name: workspace-os

services:
  app:
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-local}
    image: workspace-os:local
    container_name: workspace-os
    restart: unless-stopped
    env_file: .env
    environment:
      # Container-internal paths and port always win over .env values meant for local runs.
      NODE_ENV: production
      APP_PORT: "3000"
      APP_HOST: 0.0.0.0
      DATABASE_PATH: /data/workspace.sqlite
      BACKUP_DIR: /backups
    ports:
      # Published on loopback only. Expose to your phone with Tailscale Serve (docs/DEPLOY_WINDOWS_TAILSCALE.md).
      - "127.0.0.1:${HOST_PUBLISHED_PORT:-4390}:3000"
    volumes:
      - wos-data:/data
      - wos-backups:/backups
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 20s

volumes:
  wos-data:
  wos-backups:

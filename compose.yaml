name: workspace-os

services:
  app:
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-local}
    image: workspace-os:local
    container_name: workspace-os
    restart: unless-stopped
    env_file: .env
    environment:
      # Container-internal paths and port always win over .env values meant for local runs.
      NODE_ENV: production
      APP_PORT: "3000"
      APP_HOST: 0.0.0.0
      DATABASE_PATH: /data/workspace.sqlite
      BACKUP_DIR: /backups
      # This address is how you reach the app on the tailnet while the public name is down.
      TRUSTED_ORIGINS: http://100.108.120.8:4390
    ports:
      # Published on loopback only. Expose to your phone with Tailscale Serve (docs/DEPLOY_WINDOWS_TAILSCALE.md).
      - "100.108.120.8:4390:3000"
    volumes:
       - /home/vipul/workspace/workspace-os/data:/data
       - /home/vipul/workspace/workspace-os/backups:/backups
       # Built web app, so a screen change does not need a full image rebuild.
       - /home/vipul/workspace/workspace-os/apps/web/dist:/app/web:ro
       - /home/vipul/workspace/workspace-os/apps/server/dist:/app/dist:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 20s

volumes:
  wos-data:
  wos-backups:
